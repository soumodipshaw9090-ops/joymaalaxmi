{% extends "base.html" %}
{% block bodyclass %}admin{% endblock %}

{% block content %}
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-brand">JML Admin</div>
    <nav>
      <a href="{{ url_for('admin_dashboard') }}" class="{{ 'active' if active=='dashboard' else '' }}">Dashboard</a>
      <a href="{{ url_for('admin_orders') }}" class="{{ 'active' if active=='orders' else '' }}">Orders</a>
      <a href="{{ url_for('admin_products') }}" class="{{ 'active' if active=='products' else '' }}">Products</a>
      <a href="{{ url_for('admin_categories') }}" class="{{ 'active' if active=='categories' else '' }}">Categories</a>
      <a href="{{ url_for('index') }}">View site</a>
      <a href="{{ url_for('admin_logout') }}">Log out</a>
    </nav>
  </aside>
  <div class="admin-content">
    {% block admin_content %}{% endblock %}
  </div>
</div>
{% endblock %}
