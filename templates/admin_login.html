{% extends "base.html" %}
{% block title %}Admin login — {{ SHOP_NAME }}{% endblock %}
{% block bodyclass %}admin{% endblock %}

{% block content %}
<section class="admin-login">
  <form class="admin-login-form" method="post">
    <h1>Admin login</h1>
    <p class="muted">{{ SHOP_NAME }} back office</p>
    <label>Username
      <input type="text" name="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button type="submit" class="btn btn-primary btn-large">Log in</button>
  </form>
</section>
{% endblock %}
