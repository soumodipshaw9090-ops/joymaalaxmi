{% extends "admin_base.html" %}
{% block title %}Categories — Admin{% endblock %}
{% set active = 'categories' %}

{% block admin_content %}
<h1>Categories</h1>
<form class="admin-form inline-form" method="post">
  <label>New category
    <input type="text" name="name" placeholder="e.g. Engine Oils" required>
  </label>
  <button type="submit" class="btn btn-primary">Add</button>
</form>

<ul class="category-list">
  {% for c in categories %}
    <li>{{ c['name'] }}</li>
  {% endfor %}
</ul>
{% endblock %}
